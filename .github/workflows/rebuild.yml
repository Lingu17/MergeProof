name: Linux rebuild and offline tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build the Linux image
        run: docker build --pull -t mergeproof .
      - name: Test without network or personal Git settings
        run: >-
          docker run --rm --network none
          -e GIT_CONFIG_GLOBAL=/dev/null -e GIT_CONFIG_NOSYSTEM=1
          mergeproof python -m unittest discover -s tests -v
      - name: Run the server and check its HTTP health
        id: health
        run: |
          set +e
          docker run -d \
            --name mergeproof-smoke \
            -e MERGEPROOF_BIND_HOST=0.0.0.0 \
            -e MERGEPROOF_PORT=8000 \
            -p 127.0.0.1:18000:8000 \
            mergeproof
          start_status=$?
          if [ "$start_status" -ne 0 ]; then
            echo "Container failed to start; preserving docker run exit status: $start_status"
            docker ps -a --no-trunc || true
            docker inspect --format '{{json .State}}' mergeproof-smoke 2>&1 || true
            docker port mergeproof-smoke 2>&1 || true
            docker logs mergeproof-smoke 2>&1 || true
            exit "$start_status"
          fi
          health_file="$(mktemp)"
          dashboard_file="$(mktemp)"
          health_ok=0
          for attempt in $(seq 1 30); do
            container_state="$(docker inspect --format '{{.State.Status}}' mergeproof-smoke 2>/dev/null)"
            if [ "$container_state" != "running" ]; then
              echo "Container exited before health became ready (state: ${container_state:-unknown})"
              docker ps -a --no-trunc || true
              docker inspect --format '{{json .State}}' mergeproof-smoke 2>&1 || true
              docker port mergeproof-smoke 2>&1 || true
              docker logs mergeproof-smoke 2>&1 || true
              exit 1
            fi

            health_code="$(curl --silent --show-error --connect-timeout 1 --max-time 3 \
              --output "$health_file" --write-out '%{http_code}' \
              http://127.0.0.1:18000/api/health 2>/dev/null)"
            if [ "$health_code" = "200" ] && python -c "import json, pathlib; data=json.loads(pathlib.Path('$health_file').read_text()); assert data.get('status') == 'ok' and data.get('service') == 'mergeproof'"; then
              health_ok=1
              echo "API health ready on polling attempt $attempt"
              break
            fi

            echo "API health not ready on attempt $attempt/30 (HTTP ${health_code:-request-failed}; container ${container_state})"
            if [ "$attempt" -lt 30 ]; then
              sleep 1
            fi
          done

          if [ "$health_ok" -ne 1 ]; then
            echo "API health did not return HTTP 200 with the expected service response within 30 seconds"
            docker ps -a --no-trunc || true
            docker inspect --format '{{json .State}}' mergeproof-smoke 2>&1 || true
            docker port mergeproof-smoke 2>&1 || true
            docker logs mergeproof-smoke 2>&1 || true
            exit 1
          fi

          dashboard_code="$(curl --silent --show-error --connect-timeout 1 --max-time 3 \
            --output "$dashboard_file" --write-out '%{http_code}' \
            http://127.0.0.1:18000/ 2>/dev/null)"
          if [ "$dashboard_code" != "200" ] || ! grep -q "MergeProof" "$dashboard_file"; then
            echo "Dashboard check failed (HTTP ${dashboard_code:-request-failed})"
            docker ps -a --no-trunc || true
            docker inspect --format '{{json .State}}' mergeproof-smoke 2>&1 || true
            docker port mergeproof-smoke 2>&1 || true
            docker logs mergeproof-smoke 2>&1 || true
            exit 1
          fi
          echo "Dashboard response returned HTTP 200 and contains MergeProof"
      - name: Show server logs and clean up
        if: always()
        run: |
          docker logs mergeproof-smoke 2>/dev/null || true
          docker rm -f mergeproof-smoke 2>/dev/null || true
